name: ledgerpay

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ledgerpay]

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ledgerpay]

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
    ports:
      - "${REDPANDA_KAFKA_PORT}:19092"
      - "${REDPANDA_ADMIN_PORT}:9644"
    # Redpanda в dev-режиме стартует быстро; сервисы ждут service_started
    networks: [ledgerpay]

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    env_file: .env
    environment:
      SERVICE_NAME: auth
      HTTP_PORT: 8080
      GRPC_PORT: 50051
      DB_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "${AUTH_HTTP_PORT}:8080"
      - "${AUTH_GRPC_PORT}:50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ledgerpay]

  account:
    build:
      context: ./account
      dockerfile: Dockerfile
    env_file: .env
    environment:
      SERVICE_NAME: account
      HTTP_PORT: 8080
      GRPC_PORT: 50052
      DB_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "${ACCOUNT_HTTP_PORT}:8080"
      - "${ACCOUNT_GRPC_PORT}:50052"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [ledgerpay]

  transaction:
    build:
      context: ./transaction
      dockerfile: Dockerfile
    env_file: .env
    environment:
      SERVICE_NAME: transaction
      HTTP_PORT: 8080
      GRPC_PORT: 50053
      DB_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC_TRANSFERS: ${KAFKA_TOPIC_TRANSFERS}
    ports:
      - "${TRANSACTION_HTTP_PORT}:8080"
      - "${TRANSACTION_GRPC_PORT}:50053"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
    networks: [ledgerpay]

  notifications:
    build:
      context: ./notifications
      dockerfile: Dockerfile
    env_file: .env
    environment:
      SERVICE_NAME: notifications
      HTTP_PORT: 8080
      GRPC_PORT: 50054
      DB_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC_TRANSFERS: ${KAFKA_TOPIC_TRANSFERS}
    ports:
      - "${NOTIFICATIONS_HTTP_PORT}:8080"
      - "${NOTIFICATIONS_GRPC_PORT}:50054"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
    networks: [ledgerpay]

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    env_file: .env
    environment:
      SERVICE_NAME: gateway
      HTTP_PORT: 8080
      AUTH_GRPC_ADDR: auth:50051
      ACCOUNT_GRPC_ADDR: account:50052
      TRANSACTION_GRPC_ADDR: transaction:50053
      NOTIFICATIONS_GRPC_ADDR: notifications:50054
    ports:
      - "${GATEWAY_HTTP_PORT}:8080"
    depends_on:
      - auth
      - account
      - transaction
      - notifications
    networks: [ledgerpay]

networks:
  ledgerpay:
    driver: bridge

volumes:
  postgres_data:
